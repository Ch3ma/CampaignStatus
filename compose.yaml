services:
  web:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:5173:5173"

  emulators:
    stop_grace_period: 45s
    build:
      context: .
      target: emulators
    ports:
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:9199:9199"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4000:4000"
    volumes:
      - emulator-downloads:/root/.cache/firebase/emulators
      - emulator-data:/data

volumes:
  emulator-downloads:
  emulator-data:
